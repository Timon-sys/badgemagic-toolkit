# Publishes the web panel (web/index.html, built by web/build.py and committed)
# to GitHub Pages: https://timon-sys.github.io/badgemagic-toolkit/
name: Web panel on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # only the built panel, not its source or the build script
      - run: mkdir _site && cp web/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
